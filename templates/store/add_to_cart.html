{% extends "base.html" %}

{% block title %}Добавить в корзину{% endblock %}

{% block content %}
<h1>Добавить в корзину</h1>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="{{ form.product.id_for_label }}" class="form-label">Товар</label>
        {{ form.product }}
    </div>
    <div class="mb-3">
        <label for="{{ form.quantity.id_for_label }}" class="form-label">Количество</label>
        {{ form.quantity }}
    </div>
    <button type="submit" class="btn btn-success">Добавить в корзину</button>
    <a href="{% url 'store:product_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
